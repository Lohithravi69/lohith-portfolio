<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Lohith R</title>
  <meta name="description" content="The page you are looking for does not exist. Redirecting back to Lohith R's developer portfolio." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="./assets/lr-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #0f1629;
      --bg-card: rgba(15, 23, 42, 0.75);
      --accent-primary: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --glow-color: rgba(99, 102, 241, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    .bg-glow-1 {
      position: absolute;
      top: 15%;
      left: 20%;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: 15%;
      right: 20%;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 580px;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px var(--glow-color);
    }

    .brand-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 900;
      line-height: 1;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.75rem;
      letter-spacing: -0.04em;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text-primary);
    }

    p {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.65rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 16px -2px rgba(99, 102, 241, 0.5);
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -2px rgba(99, 102, 241, 0.65);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .redirect-notice {
      font-size: 0.85rem;
      color: var(--text-secondary);
      opacity: 0.85;
    }

    .countdown {
      font-weight: 700;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <main class="container">
    <div class="brand-tag">
      <span>Lohith R • Portfolio</span>
    </div>

    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page or link you're looking for doesn't exist or has moved. Let's get you back to the portfolio showcase.
    </p>

    <div class="btn-group">
      <a href="./" class="btn btn-primary" id="home-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Return to Home</span>
      </a>

      <a href="./#projects" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Explore Projects</span>
      </a>
    </div>

    <div class="redirect-notice">
      Redirecting automatically to home in <span id="countdown" class="countdown">6</span> seconds...
    </div>
  </main>

  <script>
    let secondsLeft = 6;
    const countdownEl = document.getElementById('countdown');
    
    // Compute target home URL dynamically
    const homeUrl = window.location.pathname.includes('/lohith-portfolio') 
      ? '/lohith-portfolio/' 
      : './';

    const timer = setInterval(() => {
      secondsLeft -= 1;
      if (countdownEl) {
        countdownEl.textContent = secondsLeft;
      }
      if (secondsLeft <= 0) {
        clearInterval(timer);
        window.location.href = homeUrl;
      }
    }, 1000);
  </script>
</body>
</html>
